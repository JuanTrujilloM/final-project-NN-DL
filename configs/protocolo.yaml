seed: 42
metric: f1_macro

paths:
  raw: data/raw
  processed: data/processed
  results: results/data

humaid:
  repo: QCRI/HumAID-events
  # Each disaster goes whole to one set (see docs/protocolo-experimental.md).
  events:
    train:
      - california_wildfires_2018
      - canada_wildfires_2016
      - ecuador_earthquake_2016
      - hurricane_dorian_2019
      - hurricane_harvey_2017
      - hurricane_irma_2017
      - hurricane_maria_2017
      - hurricane_matthew_2016
      - italy_earthquake_aug_2016
      - kerala_floods_2018
      - midwestern_us_floods_2019
      - pakistan_earthquake_2019
      - srilanka_floods_2017
    val:
      - cyclone_idai_2019
      - kaikoura_earthquake_2016
    test:
      - puebla_mexico_earthquake_2017
      - maryland_floods_2018
      - hurricane_florence_2018
      - greece_wildfires_2018
  # Internal test of the train events, kept apart as an optimistic reference.
  intra_event_reference: true
  # Minimum tweets per class so no class is nearly empty.
  min_per_class:
    val: 15
    test: 30

dedup:
  # Same threshold as the HumAID paper.
  near_duplicate_threshold: 0.75

chile:
  enabled: true
  repo: QCRI/CrisisBench-all-lang
  event: 2014_chile_earthquake_esp

colombia:
  # Hand-annotated posts of Colombian disasters, one subfolder per source (x/, bluesky/, reddit/, ...); skipped when empty
  raw: data/raw/colombia
  output: colombia_es

translation:
  # Output of notebooks/traduccion.ipynb (Kaggle), turned into data/processed/humaid_es
  raw: data/raw/humaid_events_translated

bilingual:
  output: data/processed/bilingue
